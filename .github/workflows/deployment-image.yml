name: Deployment image

on:
  push:
    branches:
      - integration/v0.2.15-canvas-workbench
      - integration/v0.2.15-video-plugin
      - codex/video-https-upstream-0216
      - codex/minimax-h3-full-adapter-20261022
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deployment-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Gateway and reference-media regression tests (no provider calls)
        working-directory: backend
        run: go test -tags unit ./internal/service ./internal/server/routes ./internal/handler -run 'Test.*(Video|Grok|MiniMax|H3|Composite|ModelPlaza)' -count=1
      - name: Video plugin regression tests (mock providers only)
        working-directory: plugins/video-volcengine
        run: go test ./...
      - name: Model plaza and settings unit tests
        working-directory: backend
        run: go test -tags unit ./internal/service ./internal/handler ./internal/handler/admin -run 'Test.*ModelPlaza|Test.*Plaza|Test.*Settings' -count=1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@9 --activate
      - name: Account and billing UI regression tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/components/account/__tests__/CreateAccountModal.spec.ts src/components/account/__tests__/ModelWhitelistSelector.spec.ts src/components/account/__tests__/EditAccountModal.spec.ts
          pnpm exec vitest run --config vitest.video.config.ts
          pnpm exec vitest run src/components/modelPlaza/__tests__ src/i18n/__tests__/localeKeyCompleteness.spec.ts
      - name: Canvas type check and production build
        working-directory: frontend/workbenches/infinite-canvas
        run: |
          npm ci --legacy-peer-deps
          node --experimental-strip-types --test tests/minimax-h3.test.mjs
          npm run typecheck
          npm run build
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        component: [main, video-plugin]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image name
        id: metadata
        shell: bash
        run: |
          suffix="canvas"
          version="$(cat backend/cmd/server/VERSION)-zsh-canvas"
          if [[ "$GITHUB_REF_NAME" == "integration/v0.2.15-video-plugin" || "$GITHUB_REF_NAME" == "codex/video-https-upstream-0216" || "$GITHUB_REF_NAME" == "codex/minimax-h3-full-adapter-20261022" ]]; then
            suffix="video"
            version="$(cat backend/cmd/server/VERSION)-zsh-video"
          fi
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          context="."
          if [[ "${{ matrix.component }}" == "video-plugin" ]]; then
            repository="${repository}-video-plugin"
            context="plugins/video-volcengine"
          fi
          image="${repository}:${suffix}-${GITHUB_SHA:0:12}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Deployment image" >> "$GITHUB_STEP_SUMMARY"
          echo "$image" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ steps.metadata.outputs.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.image }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=deployment-${{ matrix.component }}-amd64
          cache-to: type=gha,mode=max,scope=deployment-${{ matrix.component }}-amd64
      - name: Record digest
        run: echo '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
