name: Deployment image

on:
  push:
    branches:
      - integration/v0.2.15-canvas-workbench
      - integration/v0.2.15-video-plugin
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deployment-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        component: [main, video-plugin]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image name
        id: metadata
        shell: bash
        run: |
          suffix="canvas"
          version="0.2.15-zsh-canvas"
          if [[ "$GITHUB_REF_NAME" == "integration/v0.2.15-video-plugin" ]]; then
            suffix="video"
            version="0.2.15-zsh-video"
          fi
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          context="."
          if [[ "${{ matrix.component }}" == "video-plugin" ]]; then
            repository="${repository}-video-plugin"
            context="plugins/video-volcengine"
          fi
          image="${repository}:${suffix}-${GITHUB_SHA:0:12}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Deployment image" >> "$GITHUB_STEP_SUMMARY"
          echo "$image" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ steps.metadata.outputs.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.image }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=deployment-${{ matrix.component }}-amd64
          cache-to: type=gha,mode=max,scope=deployment-${{ matrix.component }}-amd64
      - name: Record digest
        run: echo '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
