name: Deployment image

on:
  push:
    branches:
      - integration/v0.2.15-canvas-workbench
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deployment-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image name
        id: metadata
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:canvas-${GITHUB_SHA:0:12}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "### Deployment image" >> "$GITHUB_STEP_SUMMARY"
          echo "$image" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.image }}
          build-args: |
            VERSION=0.2.15-zsh-canvas
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.2.15-zsh-canvas
          cache-from: type=gha,scope=deployment-amd64
          cache-to: type=gha,mode=max,scope=deployment-amd64
      - name: Record digest
        run: echo '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
